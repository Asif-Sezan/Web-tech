<!DOCTYPE html>
<html>
<head>
    <title>Campus Club Membership</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, white 0%, white 100%);
            color: black;
        }

        .topnav {
            position: sticky;
            top: 0;
            background: #2f234a;
            overflow: hidden;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .topnav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 14px 18px;
            transition: 0.25s ease;
            font-weight: 600;
        }

        .topnav a:hover {
            background-color: purple;
            color: white;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 18px 50px;
        }

        h1 {
            text-align: center;
            color: rgba(3, 121, 164, 0.964);
            margin: 32px 0 22px;
            font-size: 2.6rem;
            letter-spacing: 1px;
        }

        .card {
            width: 430px;
            margin: 0 auto;
            background: linear-gradient(180deg, white 0%, white 100%);
            border: 3px solid purple;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 12px 28px black;
            position: relative;
        }

        .card > h2 {
            color: rgba(3, 121, 164, 0.964);
            margin-top: 0;
            font-size: 1.8rem;
        }

        .card p {
            font-style: italic;
            line-height: 1.6;
            color: grey;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, red, red);
            color: #fff;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.6px;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
        }

        form {
            max-width: 560px;
            margin: 30px auto 0;
        }

        fieldset {
            border: 2px solid #c084fc;
            border-radius: 14px;
            padding: 20px 22px;
            background: white;
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.08);
        }

        legend {
            font-size: 1.2em;
            font-weight: bold;
            padding: 0 8px;
            color: #4c1d95;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 8px;
            font-weight: 700;
            color: #374151;
        }

        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid rgba(14, 165, 233, 0.25);
            border-color: #38bdf8;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            vertical-align: middle;
            accent-color: #8b5cf6;
        }

        .radio-group {
            margin-top: 8px;
        }

        .radio-group label {
            display: inline-block;
            margin-right: 18px;
            font-weight: 600;
            color: #2d3748;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 22px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #14b8a6, #0f766e);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        button:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="topnav">
        <a href="#">Home</a>
        <a href="#">Events</a>
        <a href="#">Join</a>
    </div>

    <div class="container">
        <h1>Programming Club</h1>

        <div class="card">
            <span class="badge">NEW</span>
            <h2>Build, Code, Create</h2>
            <p>We bring together students who love problem-solving, creativity, and teamwork. Explore coding challenges, robotics projects, and collaborative events designed to inspire innovation.</p>
        </div>

        <form action="------" method="post">
            <fieldset>
                <legend>Join the Club</legend>

                <label for="fullName">Full Name</label>
                <input type="text" class="name=field" id="fullName" name="fullName" placeholder="Enter your full name" required minlength="3">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter email address" required>

                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" name="studentId" placeholder="24-56789-1" pattern="[0-9]{2}-[0-9]{5}-[0-9]" required>

                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="17" max="40" required>

                <label>Membership Type</label>
                <div class="radio-group">
                    <label><input type="radio" name="membershipType" value="General" required>General</label>
                    <label><input type="radio" name="membershipType" value="Executive">Executive</label>
                </div>

                <label for="preferredClub">Preferred Club</label>
                <select id="preferredClub" name="preferredClub" required>
                    <option value="">Select a club</option>
                    <option value="Programming">Programming</option>
                    <option value="Robotics">Robotics</option>
                    <option value="Debate">Debate</option>
                </select>

                <label for="reason">Why do you want to join?</label>
                <textarea id="reason" name="reason" maxlength="200" placeholder="Give your reason within 200 words" required></textarea>

                <label>
                    <input type="checkbox" id="rulesAgreement" name="rulesAgreement" required>
                    I agree to the club rules
                </label>

                <button type="submit">Join Club</button>
            </fieldset>
        </form>
    </div>
</body>
</html>
